[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "lorelens"
version = "0.1.0"
description = "Agentic RAG search for technical documentation (LangGraph + MCP + Pinecone + LangFuse)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Akshay Navani" }]
license = { text = "MIT" }
dependencies = [
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.5",
    "langchain-openai>=0.2.6",
    "langchain-text-splitters>=0.3.2",
    "langchain-huggingface>=0.1.2",
    "langchain-mcp-adapters>=0.1.0",
    "langgraph>=0.2.50",
    "mcp>=1.6.0",
    "pinecone>=5.4.0",
    "openai>=1.54.0",
    "tiktoken>=0.8.0",
    "langfuse>=3.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sse-starlette>=2.1.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.13.0",
    "rich>=13.9",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "python-frontmatter>=1.1.0",
    "cachetools>=5.5",
    "tenacity>=9.0",
]

[project.optional-dependencies]
huggingface = [
    "sentence-transformers>=3.2",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
]

[project.scripts]
lorelens = "lorelens.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lorelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
